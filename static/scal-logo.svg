<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Scal the chameleon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f7ee"/>
      <stop offset="1" stop-color="#c9ecd6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fcf80"/>
      <stop offset="1" stop-color="#2f9e5b"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <!-- branch -->
  <path d="M28 192 C80 182 150 186 226 172" stroke="#8b5a2b" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M196 174 C206 160 214 158 222 150" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round" fill="none"/>
  <ellipse cx="214" cy="146" rx="11" ry="6" transform="rotate(-35 214 146)" fill="#43b36a"/>
  <!-- curled tail -->
  <path d="M70 138 C34 140 24 182 52 188 C74 192 82 166 64 162 C54 160 50 172 58 174" stroke="#2f9e5b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- legs -->
  <path d="M98 160 L96 186" stroke="#2a8a50" stroke-width="13" stroke-linecap="round"/>
  <path d="M146 162 L148 184" stroke="#2a8a50" stroke-width="13" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="120" cy="130" rx="64" ry="42" fill="url(#body)"/>
  <!-- belly -->
  <path d="M70 148 C96 170 150 172 176 148 C160 158 90 160 70 148Z" fill="#b8ec9f" opacity=".85"/>
  <!-- head + casque -->
  <path d="M158 112 C158 84 176 70 194 74 L204 62 L212 78 C228 86 232 108 218 124 C206 138 164 140 158 112Z" fill="#4cc072"/>
  <!-- snout -->
  <ellipse cx="220" cy="116" rx="12" ry="10" fill="#5fcf80"/>
  <path d="M206 128 C214 134 224 132 230 124" stroke="#1f6f40" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- eye -->
  <circle cx="192" cy="104" r="21" fill="#a6e6bb"/>
  <circle cx="192" cy="104" r="15" fill="#ffffff" stroke="#1f6f40" stroke-width="4"/>
  <circle cx="195" cy="106" r="7.5" fill="#16281d"/>
  <circle cx="198" cy="103" r="2.6" fill="#ffffff"/>
  <!-- spots -->
  <circle cx="92" cy="112" r="6" fill="#ffd166"/>
  <circle cx="122" cy="102" r="5" fill="#ffb5c2"/>
  <circle cx="150" cy="118" r="5" fill="#ffd166"/>
  <circle cx="74" cy="132" r="4" fill="#ffb5c2"/>
  <!-- shield badge -->
  <path d="M112 118 L136 118 L136 138 C136 150 124 156 124 156 C124 156 112 150 112 138Z" fill="#ffffff" stroke="#1f6f40" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M117 136 L122 142 L132 128" stroke="#2f9e5b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
